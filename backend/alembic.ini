# ============================================================
# Alembic configuration
#
# NOTE: This file is intentionally ASCII-only (English comments).
# Reason: Alembic reads it via configparser with encoding="locale".
# On a Chinese Windows the locale encoding is GBK, so any non-ASCII
# byte here raises UnicodeDecodeError before Alembic even starts.
# Chinese docs for this file live in backend/README.md instead.
#
# NOTE: sqlalchemy.url is intentionally NOT set here.
# alembic/env.py injects it from app.core.config.settings, so the
# application and the migrations can never point at different databases.
# ============================================================

[alembic]
# Directory holding migration scripts, relative to this file.
script_location = alembic

# Add the current directory to sys.path so env.py can `import app.*`.
# Without this line: ModuleNotFoundError: No module named 'app'
prepend_sys_path = .

# Migration filename format: 20260921_1430_ab12_add_ticket_table.py
# Timestamp prefix keeps the versions directory in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used for the timestamp in filenames.
timezone = Asia/Shanghai

# Also configured in env.py; duplicated here for offline mode.
[alembic:compare_type]
compare_type = true

# ---- Logging (consumed by fileConfig) ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
