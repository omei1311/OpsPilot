name: Offline reliability tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  approval-safety:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: backend
      PYTHONUTF8: '1'
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: >-
          python -m pip install
          'fastapi>=0.115' 'SQLAlchemy[asyncio]>=2.0.36'
          'pydantic-settings>=2.6' 'pytest>=8.3' 'aiosqlite>=0.20'
      - name: Check backend syntax
        run: python -m compileall -q backend/app
      - name: Verify approval isolation and concurrency
        run: python -m pytest -c backend/pyproject.toml backend/tests_offline
