# ============================================================
# nginx 配置：托管前端静态资源 + 反代后端 API
#
# ★ 最关键的部分是 SSE 那个 location。
#   配错了的表现是"AI 回答不流式，转圈半天后一次性全部出现"——
#   功能看着是对的，但整个流式的意义没了，而且很难查。
# ============================================================

server {
    listen 80;
    server_name _;

    # 前端打包产物
    root /usr/share/nginx/html;
    index index.html;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── 压缩 ───────────────────────────────────────────────
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── 静态资源 ───────────────────────────────────────────
    #
    # 带 hash 的构建产物可以长期缓存（文件名变了就是新文件）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── ★ SSE 流式接口 ─────────────────────────────────────
    #
    # 路径要写在 /api/ 前面 —— nginx 的 location 匹配有优先级，
    # 更具体的路径要放在前面才能先命中。
    location ~ ^/api/v1/agent/(chat|actions/.*/(approve|reject))$ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        # ★★★ 这三行是 SSE 能工作的关键 ★★★
        #
        # proxy_buffering off
        #   nginx 默认会把后端响应攒够一个缓冲区再发给客户端。
        #   对普通接口无所谓，对 SSE 是致命的 —— 后端明明一条条在发，
        #   前端却什么都收不到，直到缓冲区满了才哗一下全出来。
        #   关掉之后 nginx 收到一点转发一点。
        proxy_buffering off;
        proxy_cache off;
        # 告诉 nginx 用 chunked 传输，不要等 Content-Length
        chunked_transfer_encoding off;

        # Connection 置空：让 nginx 用 HTTP/1.1 的长连接转发，
        # 不然后端看到的可能是 Connection: close，连不上就断
        proxy_set_header Connection '';

        # ★ 超时时间要调大
        #   默认 60 秒。Agent 一次可能跑十几秒，用户看确认卡片可能几分钟，
        #   不调大的话连接会被 nginx 主动掐断。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 透传客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 双保险：后端也会返回这个头，这里再设一次
        add_header X-Accel-Buffering no;
    }

    # ── 普通 API ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 普通接口不需要长连接
        proxy_read_timeout 120s;

        # 上传大请求体时用得到（将来加工单附件）
        client_max_body_size 20m;
    }

    # ── 接口文档 ───────────────────────────────────────────
    location ~ ^/(docs|redoc) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 前端路由兜底 ───────────────────────────────────────
    #
    # ★ 这行必须有。
    #
    # 前端用的是 history 模式路由（URL 里没有 #）。
    # 用户直接访问 /tickets/123 或刷新页面时，nginx 会去找
    # 磁盘上的 /tickets/123 文件 —— 当然不存在，返回 404。
    #
    # try_files 的作用：先找对应的文件，找不到就返回 index.html，
    # 交给前端的路由去处理。这是 SPA 部署的标准做法。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
